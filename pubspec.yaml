name: kumbmela_multilingual
description: "Speech-to-Text mobile app using the Groq Whisper API."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client for Groq API multipart uploads
  dio: ^5.8.0+1

  # Microphone audio recording
  record: ^6.0.0

  # Runtime permission requests
  permission_handler: ^12.0.0+1

  # Local path for saving recorded audio files
  path_provider: ^2.1.5

  # Playback of recorded audio before/after transcription
  audioplayers: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
